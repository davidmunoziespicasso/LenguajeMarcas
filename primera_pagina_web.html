<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Hola mundo</title>
    <style>
        *{
            margin: 0 auto;
            text-align: center;
        }
        main{
            width: 100%;
            height: 425px;
            background-color: gray;
        }

        header{
            width: 98%;
            height: 50px;
            background-color: orange;
            border-radius: 40px;
            color: blue;
            padding: 5px;
            margin-left: 5px;
            margin-right: 5px;
        }
        section{
            width: 98%;
            height: 300px;
            background-color: yellow;
            border-radius: 40px;
            color: blue;
            padding: 5px;
            margin-left: 5px;
            margin-right: 5px;
        }
        footer{
            width: 98 %;
            height: 40px;
            background-color: red;
            border-radius: 40px;
            color: blue;
            padding: 5px;
            margin-left: 5px;
            margin-right: 5px;
        }
        aside{
            width: 500px;
            height: 90%;
            background-color: green ;
            border-radius: 40px;
            color: blue;
            padding: 5px;
            margin-left: 5px;
            margin-right: 5px;
            float: left;
            text-align: left;
        }
        
        article{
            width: 1000px;
            height: 90%;
            background-color: green ;
            border-radius: 40px;
            color: blue;
            padding: 5px;
            margin-left: 5px;
            margin-right: 5px;
            float: right;
        }

        section aside ul li{
            list-style: none;
        }
        section article p{
            padding-top: 20px;
            font-size: 60px;
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>MI PRIMERA PAGINA WEB</h1>
        </header>
        <section>
            <aside>
                <p>Menu</p>
                <ul>
                    <li><a href="#">Opcion1</li>
                    <li><a href="#">Opcion2</li>
                    <li><a href="#">Opcion3</li>
                    <li><a href="#">Opcion4</li>
                    <li><a href="#">Opcion5</li>
                </ul>
            </aside>
            <article>
                <p>Bienvenidos</p>
            </article>
        </section>
        <footer>
            <p>Copyright David Muñoz Hedrera©</p>
        </footer>

    </main>
</body>
</html>
